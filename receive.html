<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<meta name="mobile-web-app-capable" content="yes">
<title>CutTrack Receiving</title>
<script src="cw-store.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style id="pageStyle">@page{size:A4;margin:12mm}</style>
<style>
:root{--bg:#edf2ee;--card:#fff;--ink:#121a15;--mut:#5a6760;--line:#d9e2dc;--pri:#14532d;--pri2:#e3f0e7;--ok:#15803d;--okbg:#e3f5e9;--bad:#c0261a;--badbg:#fde9e7;--warn:#b45309;--warnbg:#fff1dc;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none}
button{font:inherit}
.wrap{max-width:640px;margin:0 auto;padding:10px 12px 96px}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who span{font-size:12px;opacity:.85}
.net{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:#ffffff26;white-space:nowrap}
.net.off{background:#c0261a}.net.q{background:#b45309}
.ib{background:#ffffff1f;border:0;color:#fff;width:42px;height:42px;border-radius:10px;font-size:20px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--pri);background:var(--pri);color:#fff;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer;min-height:48px}
.btn.sec{background:#fff;color:var(--pri)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.bad{background:var(--bad);border-color:var(--bad)}
.btn.big{min-height:58px;font-size:18px;width:100%}
.btn.sm{min-height:36px;padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row>.btn{flex:1}
input,select,textarea{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
label.f{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
label.f input,label.f select,label.f textarea{margin-top:4px}
.muted{color:var(--mut);font-size:13px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:13px;margin:12px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.rc{border-radius:var(--r);padding:16px;margin-bottom:10px;color:#fff;background:#4f5a53}
.rc.on{background:var(--pri)}
.rc .k{font-size:13px;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
.rc .job{font-size:24px;font-weight:800;line-height:1.15}
.rc .sub{font-size:14px;opacity:.9;margin-top:4px}
.rc .cnt{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
.rc .cnt div b{display:block;font-size:30px;line-height:1}
.rc .cnt div span{font-size:12px;opacity:.85}
.rc.bump{animation:bump .35s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
.last{border-radius:var(--r);padding:12px 14px;margin-bottom:10px;font-weight:700;font-size:17px;border:2px solid var(--line);background:#fff;min-height:54px}
.last.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.last.warn{border-color:var(--warn);background:var(--warnbg);color:var(--warn)}
.last.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.last.info{color:var(--mut)}
.last small{display:block;font-weight:500;font-size:13px;color:var(--ink);opacity:.8}
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000;display:none;margin-bottom:8px}
#reader.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;background:#f7faf8}
.chip.bad{border-color:#f3b4ad;background:var(--badbg)}.chip.warn{border-color:#f0c88f;background:var(--warnbg)}
.bar{height:9px;background:#e4ebe6;border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t td.n,table.t th.n{text-align:right}
.feed div{padding:6px 9px;border-left:4px solid var(--line);margin-bottom:4px;background:#fff;border-radius:4px;font-size:13.5px}
.feed .ok{border-color:var(--ok)}.feed .bad{border-color:var(--bad);background:var(--badbg)}.feed .warn{border-color:var(--warn);background:var(--warnbg)}.feed .info{border-color:#98a2b3}
.feed span{color:var(--mut);font-size:12px;margin-right:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px 12px;text-align:left;cursor:pointer;min-height:70px}
.tile b{display:block;font-size:17px}
.tile span{font-size:12px;color:var(--mut)}
.ov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:#000a}
.ov.on{display:flex}
.ovc{width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:16px;padding:20px;background:#fff;color:var(--ink)}
.ov.bad .ovc{background:var(--bad);color:#fff}
.ov.warn .ovc{background:#c96a05;color:#fff}
.ovt{font-size:26px;font-weight:900;line-height:1.1;margin-bottom:10px}
.ov.info .ovt{font-size:21px}
.ovm{font-size:16.5px;line-height:1.45}
.ovm b{font-size:18px}
.ovb{display:grid;gap:8px;margin-top:18px}
.ov.bad .btn,.ov.warn .btn{background:#fff;color:var(--ink);border-color:#fff}
.ov.bad .btn.sec,.ov.warn .btn.sec{background:transparent;color:#fff;border-color:#ffffffaa}
.ov.bad .ovc{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.verdict{border-radius:10px;padding:10px 12px;font-weight:700;margin:8px 0}
.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.warn{background:var(--warnbg);color:var(--warn)}.verdict.bad{background:var(--badbg);color:var(--bad)}
#pin{z-index:120}
.pinbox{max-width:340px}
.dots{display:flex;gap:14px;justify-content:center;margin:14px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--pri);display:block}
.dots i.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:62px;font-size:24px;font-weight:700;border:1px solid var(--line);background:#f5f8f6;border-radius:12px;cursor:pointer;color:var(--ink)}
.perr{color:var(--bad);font-weight:700;text-align:center;min-height:22px}
#flash{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:0}
#flash.f-ok{background:#15803d;animation:fl .4s}
#flash.f-warn{background:#c96a05;animation:fl .7s}
@keyframes fl{0%{opacity:.28}100%{opacity:0}}
#wedge{position:fixed;left:-500px;top:0;width:10px;opacity:0}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fffffff2;border-top:1px solid var(--line);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.foot .row{max-width:640px;margin:0 auto}
.hidden{display:none!important}
.demo{background:var(--warnbg);color:var(--warn);font-size:12.5px;font-weight:600;text-align:center;padding:5px}
#printArea{display:none}
.doc{font-family:Arial,Helvetica,sans-serif;color:#000;font-size:10pt;background:#fff}
.doc .dh{border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.doc .dt{font-size:17pt;font-weight:700}
.doc table{border-collapse:collapse;width:100%;margin:4px 0 10px}
.doc th,.doc td{border:1px solid #888;padding:3px 5px;font-size:9pt;text-align:left}
.doc th{background:#eee}
.doc .kv td{border:0;padding:2px 6px 2px 0;font-size:10pt}
.doc .tot{font-size:12pt;font-weight:700;margin:6px 0 10px}
.doc .alert{border:2px solid #000;padding:6px 8px;font-weight:700;margin:8px 0}
.doc h4{margin:12px 0 3px;font-size:11pt}
.doc .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px;font-size:9pt}
.doc .sig div{border-top:1px solid #000;padding-top:3px}
@media print{body{background:#fff}body>*:not(#printArea){display:none!important}#printArea{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<input id="wedge" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" aria-hidden="true">
<div id="ov" class="ov"></div>
<div id="pin" class="ov"></div>
<div id="flash"></div>
<div id="printArea"></div>

<script>

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const now = () => new Date().toISOString();
const pad = (n, l) => String(n).padStart(l, '0');
const sumQ = a => a.reduce((s, b) => s + (+b.qty || 0), 0);
const uniq = a => [...new Set(a)];
const str = v => v == null ? '' : String(v);
const today = () => new Date().toLocaleDateString('en-CA');
const tm = () => new Date().toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const fmtD = d => d ? new Date(d).toLocaleString('en-ZA', { dateStyle: 'medium', timeStyle: 'short' }) : '';
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const bagTxt = code => code ? code.replace(/^BAG-/, 'BAG ') : '';
const RECEIVED = ['OK', 'PRINTER_MISMATCH', 'NOT_DISPATCHED', 'FOUND', 'PART_NOT_PRINTED', 'SKIPPED_PRINTER'];     // results where the panel bundle is taken in
const RES = { OK: 'Received', WRONG_JOB: 'Wrong job — quarantined', PRINTER_MISMATCH: 'Sent to another printer', NOT_DISPATCHED: 'Never dispatched to the printer', PART_NOT_PRINTED: 'Unprinted part came from the printer', SKIPPED_PRINTER: 'Print part came straight from cutting', DUPLICATE: 'Already received', UNKNOWN: 'Unknown ticket', FOUND: 'Found (was missing)' };

let DEV = LS.get('cw_recv_dev', null);
let SES = LS.get('cw_recv_session', null);
let RC = LS.get('cw_recv_receipt', null);          // receipt in progress
let QUEUE = LS.get('cw_recv_queue', []);
let CUTS = LS.get('cw_recv_cuts', []);
let PARTIES = LS.get('cw_recv_parties', []);
let JOBB = LS.get('cw_recv_jobs', {});              // cut_id -> { bundles, bagdn }
let FEED = [], ONLINE = true, OVBUSY = false;
const saveRC = () => LS.set('cw_recv_receipt', RC);
const saveQ = () => LS.set('cw_recv_queue', QUEUE);
const saveJobs = () => { const keep = Object.keys(JOBB).slice(-6); if (RC?.cut_id && !keep.includes(RC.cut_id)) keep.push(RC.cut_id); JOBB = Object.fromEntries(keep.filter(k => JOBB[k]).map(k => [k, JOBB[k]])); LS.set('cw_recv_jobs', JOBB); };

/* ---------------- network + offline queue ---------------- */
const isNet = e => !navigator.onLine || /fetch|network|timeout|load failed|networkerror|econn|failed to|offline/i.test((e && e.message) || '');
const withTO = (p, ms = 5000) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
async function net(fn, ms = 4000, force = false) {
  if (Store.live && !ONLINE && !force) { const e = new Error('offline'); e.net = true; throw e; }
  try { const r = await withTO(fn(), ms); setOnline(true); return r; }
  catch (e) { if (Store.live && isNet(e)) { setOnline(false); e.net = true; } throw e; }
}
function setOnline(v) { if (ONLINE !== v) { ONLINE = v; renderNet(); } }
function renderNet() {
  const n = $('#net'); if (!n) return;
  if (!Store.live) { n.className = 'net'; n.textContent = 'DEMO'; return; }
  n.className = 'net' + (!ONLINE ? ' off' : QUEUE.length ? ' q' : '');
  n.textContent = !ONLINE ? `OFFLINE${QUEUE.length ? ' · ' + QUEUE.length : ''}` : QUEUE.length ? `Syncing ${QUEUE.length}` : '● Online';
}
async function exec(op) {
  switch (op.t) {
    case 'receipt_new': { const ex = await Store.one('cw_receipts', { id: op.row.id }); if (!ex) await Store.insert('cw_receipts', [op.row]); return { ok: true }; }
    case 'receipt_job': await Store.update('cw_receipts', { id: op.id }, { cut_id: op.cut_id }); return { ok: true };
    case 'part': {   // one row per bundle x part; unique, so two clerks can never both receive the same panel bundle
      const row = op.row, ex = await Store.one('cw_bundle_parts', { bundle_id: row.bundle_id, part_no: row.part_no });
      if (ex) {
        if (ex.receipt_id === row.receipt_id && ex.status === row.status) return { ok: true };
        if (op.allowFrom && op.allowFrom.includes(ex.status)) { const { id, created_at, ...patch } = row; await Store.update('cw_bundle_parts', { id: ex.id }, patch); return { ok: true }; }
        return { conflict: `#${row.bundle_no} ${row.part_name} is already ${ex.status === 'RECEIVED' ? 'received' : ex.status.toLowerCase()}${ex.receipt_no ? ' on ' + ex.receipt_no : ''}`, part: ex };
      }
      try { await Store.insert('cw_bundle_parts', [row]); } catch (e) { if (/duplicate|unique/i.test(e.message)) return { conflict: `#${row.bundle_no} ${row.part_name} was received on another device at the same moment` }; throw e; }
      return { ok: true };
    }
    case 'bundle_loc': {
      const r = await Store.updateCond('cw_bundles', { id: op.id, location: op.from }, { location: op.to, holder: op.holder, received_at: op.at, received_by: op.by, receipt_id: op.receipt });
      if (r.length) return { ok: true };
      const b = await Store.one('cw_bundles', { id: op.id });
      return b && b.location === op.to ? { ok: true } : { ok: true, note: 'bundle location changed elsewhere' };
    }
    case 'item': { const ex = await Store.one('cw_receipt_items', { id: op.row.id }); if (!ex) await Store.insert('cw_receipt_items', [op.row]); return { ok: true }; }
    case 'log': await Store.insert('cw_scans', [op.row]); return { ok: true };
  }
  return { ok: true };
}
async function push(op) {
  if (QUEUE.length) { QUEUE.push(op); saveQ(); renderNet(); setTimeout(sync, 50); return { queued: true }; }
  try { return await net(() => exec(op)); }
  catch (e) { if (e.net) { QUEUE.push(op); saveQ(); renderNet(); return { queued: true }; } throw e; }
}
let syncing = false;
async function probe() { if (!Store.live || ONLINE) return; try { await net(() => Store.list('cw_parties', {}, { limit: 1 }), 4000, true); } catch (e) {} if (ONLINE) sync(); }
async function sync() {
  if (syncing || !QUEUE.length) return;
  syncing = true; const problems = [];
  try {
    while (QUEUE.length) {
      let r; try { r = await net(() => exec(QUEUE[0]), 6000, true); } catch (e) { if (e.net) break; r = { conflict: e.message }; }
      QUEUE.shift(); saveQ(); renderNet();
      if (r && r.conflict) problems.push(r.conflict);
    }
  } finally { syncing = false; renderNet(); }
  if (problems.length) { problems.forEach(p => addFeed('bad', 'Sync: ' + p)); if (RC?.cut_id) await loadJob(RC.cut_id).catch(() => {}); render(); await show({ kind: 'bad', title: 'NEEDS ATTENTION', msg: `Back online — some scans made offline could not be accepted:<br><br>${problems.map(p => '• ' + esc(p)).join('<br>')}` }); }
}
function log(result, detail, x = {}) {
  push({ t: 'log', row: { id: uid(), created_at: now(), code: x.code || null, result, detail: detail || null, bag_code: null, cut_id: x.cut_id || null, bundle_no: x.bundle_no ?? null, sorter: SES?.name || null, supervisor: x.supervisor || null, station: DEV?.station || 'Receiving', device: DEV?.id || null } }).catch(e => console.warn(e));
}

/* ---------------- lookups ---------------- */
const cutOf = id => CUTS.find(c => c.id === id);
const jobTag = c => c ? (c.job_no ? `JOB ${c.job_no}` : `CUT ${c.cut_no}`) : '?';
const jobLine = c => c ? `${jobTag(c)} · ${c.colour || ''}` : '?';
/* parts: printed parts travel to the printer and come back; the rest come straight from cutting */
const allParts = c => (c?.parts?.length ? c.parts : [{ no: 0, name: 'Bundle' }]);
const printNos = c => { const all = allParts(c).map(p => p.no); return c?.print_parts?.length ? c.print_parts.filter(n => all.includes(n)) : all; };
const expNos = (c, src) => src === 'PRINTER' ? printNos(c) : allParts(c).map(p => p.no).filter(n => !printNos(c).includes(n));
const pName = (c, no) => allParts(c).find(p => p.no === no)?.name || ('Part ' + no);
const pState = (J, b, no) => J?.parts?.[b.id]?.[no];
const srcName = () => RC ? (RC.source === 'PRINTER' ? RC.from : 'the cutting room') : '';
const sewingName = () => PARTIES.find(p => p.kind === 'SEWING')?.name || 'Sewing Floor';
async function loadBase() {
  const [c, p] = await Promise.all([net(() => Store.list('cw_cuts', {}, { order: 'created_at', limit: 3000 })), net(() => Store.list('cw_parties', {}, { order: 'name', asc: true }))]);
  CUTS = c.map(x => ({ id: x.id, cut_ref: x.cut_ref, style: x.style, colour: x.colour, cut_no: x.cut_no, job_no: x.job_no, po_no: x.po_no, printer: x.printer, parts: x.parts || [], print_parts: x.print_parts || [] })); PARTIES = p;
  LS.set('cw_recv_cuts', CUTS); LS.set('cw_recv_parties', PARTIES);
}
async function loadJob(cutId) {
  const [bs, bags, prts] = await Promise.all([net(() => Store.list('cw_bundles', { cut_id: cutId }, { order: 'bundle_no', asc: true }), 8000), net(() => Store.list('cw_bags', { cut_id: cutId }), 8000), net(() => Store.list('cw_bundle_parts', { cut_id: cutId }), 8000)]);
  const parts = {}; prts.forEach(p => { (parts[p.bundle_id] = parts[p.bundle_id] || {})[p.part_no] = { status: p.status, receipt_id: p.receipt_id, receipt_no: p.receipt_no, received_at: p.received_at, flag: p.flag }; });
  const dns = uniq(bags.map(b => b.dn_no).filter(Boolean));
  const dels = dns.length ? await net(() => Store.list('cw_deliveries', { dn_no: dns }), 8000) : [];
  const bagdn = {}; bags.forEach(g => { if (g.dn_no) { const d = dels.find(x => x.dn_no === g.dn_no); bagdn[g.code] = { dn: g.dn_no, at: d?.created_at || null, printer: d?.to_party || null, vehicle: d?.vehicle_reg || null }; } });
  JOBB[cutId] = { bundles: bs.map(b => ({ id: b.id, code: b.code, cut_id: b.cut_id, bundle_no: b.bundle_no, size: b.size, qty: b.qty, lay_no: b.lay_no, dyelot: b.dyelot, sobar_from: b.sobar_from, sobar_to: b.sobar_to, bag_code: b.bag_code, bagged_by: b.bagged_by, location: b.location, holder: b.holder, receipt_id: b.receipt_id, received_at: b.received_at })), bagdn, parts };
  saveJobs(); return JOBB[cutId];
}
function parseCode(code) { const m = /^(BDL-.+)-P(\d{1,3})$/.exec(code); return m ? { code: m[1], part: +m[2] } : { code, part: null }; }
const refOf = code => code.slice(4, code.lastIndexOf('-'));
async function findBundle(code) {
  const ref = refOf(code);
  let cut = CUTS.find(c => c.cut_ref === ref);
  if (!cut) { try { await loadBase(); } catch (e) { if (!e.net) throw e; return { err: 'OFFLINE', ref }; } cut = CUTS.find(c => c.cut_ref === ref); }
  if (!cut) return { err: 'NOJOB', ref };
  let J = JOBB[cut.id];
  if (!J) { try { J = await loadJob(cut.id); } catch (e) { if (!e.net) throw e; return { err: 'OFFLINE', ref, cut }; } }
  let b = J.bundles.find(x => x.code === code);
  if (!b) { try { J = await loadJob(cut.id); b = J.bundles.find(x => x.code === code); } catch (e) { if (!e.net) throw e; } }
  if (!b) return { err: 'NOTLISTED', cut, ref };
  return { cut, b, J };
}

/* ---------------- sound / overlays / PIN ---------------- */
let AC;
function beep(k) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
    const seq = k === 'ok' ? [[1175, .08]] : k === 'bad' ? [[260, .28], [190, .3], [260, .28], [190, .3]] : k === 'warn' ? [[700, .12], [540, .14]] : [[800, .05]];
    let t = AC.currentTime;
    seq.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = k === 'bad' ? 'square' : 'sine'; o.frequency.value = f; g.gain.value = k === 'bad' ? .22 : .15; o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d); t += d + .03; });
  } catch (e) {}

  nos = nos.filter(n => known.includes(n));
  if (!nos.length) return flagUnknown(raw, pc.part != null ? `Part ${pc.part} is not on the parts list of ${jobLine(cut)}` : `Bundle ticket without a part — scan the part stickers`, { cut_id: cut.id, job: jobTag(cut) });
  nos = nos.filter(n => !RC.items.some(i => i.key === b.id + ':' + n));
  if (!nos.length) { lastMsg('info', `#${b.bundle_no} ${esc(pc.part != null ? pName(cut, pc.part) : '')} is already on this receipt`); beep('info'); return; }
  const base = n => ({ code: raw, bundle_id: b.id, cut_id: b.cut_id, bundle_no: b.bundle_no, size: b.size, qty: b.qty, part_no: n, part_name: pName(cut, n), manual, dn_no: dn.dn || null, job: jobTag(cut) });
  const label = nos.map(n => pName(cut, n)).join(' + ');
  // 1. wrong job -> quarantine + supervisor PIN
  if (RC.cut_id && b.cut_id !== RC.cut_id) {
    const rc = cutOf(RC.cut_id);
    log('RCV_WRONG_JOB', `${jobLine(cut)} #${b.bundle_no} ${label} found in receipt for ${jobLine(rc)}`, { code: raw, cut_id: b.cut_id, bundle_no: b.bundle_no });
    addFeed('bad', `WRONG JOB: #${b.bundle_no} ${label} is ${jobLine(cut)}`); lastMsg('bad', 'WRONG JOB — quarantine this bundle', `${esc(jobLine(cut))} #${b.bundle_no} ${esc(label)}`);
    let sup = null;
    await show({ kind: 'bad', title: '⛔ WRONG JOB', msg: `This bundle is<br><b>${esc(jobLine(cut))}</b><br>${esc(cut.style)} · #${b.bundle_no} · <b>${esc(label)}</b> · Size ${esc(b.size)} · ${b.qty} pcs${dn.dn ? `<br>Left cutting on ${esc(dn.dn)}${dn.printer ? ' to ' + esc(dn.printer) : ''}` : ''}<br><br>You are receiving<br><b>${esc(jobLine(rc))}</b><br><br>Put it in QUARANTINE. A supervisor must enter their PIN to continue.`,
      buttons: [{ label: 'Supervisor PIN', val: true, before: async () => { sup = await supervisorPin('Wrong-job bundle quarantined'); return !!sup; } }] });
    for (const n of nos) {
      if (!pState(J, b, n)) { const r = await push({ t: 'part', row: partRow(b, cut, n, 'QUARANTINE', 'WRONG_JOB') }); if (!r.conflict) { (J.parts[b.id] = J.parts[b.id] || {})[n] = { status: 'QUARANTINE', receipt_id: RC.id }; } }
      addItem({ ...base(n), result: 'WRONG_JOB', quarantined: true, detail: `Belongs to ${jobLine(cut)}; found with ${jobLine(rc)} from ${RC.from}${RC.ref ? ' (note ' + RC.ref + ')' : ''}. Quarantined, approved by ${sup}` });
    }
    log('RCV_QUARANTINE', `#${b.bundle_no} ${label} (${jobLine(cut)}) quarantined, approved by ${sup}`, { code: raw, cut_id: b.cut_id, bundle_no: b.bundle_no, supervisor: sup });
    saveJobs(); render(); return;
  }
  // 2. the first bundle sets the job
  if (!RC.cut_id) { RC.cut_id = b.cut_id; saveRC(); await push({ t: 'receipt_job', id: RC.id, cut_id: b.cut_id }); }
  const exp = expNos(cut, RC.source);
  const msgs = []; let worst = 'ok';
  for (const n of nos) {
    const st = pState(J, b, n), nm = pName(cut, n);
    if (st?.status === 'RECEIVED') {
      log('RCV_DUPLICATE', `#${b.bundle_no} ${nm} already received${st.receipt_no ? ' on ' + st.receipt_no : ''}`, { code: raw, cut_id: b.cut_id, bundle_no: b.bundle_no });
      addItem({ ...base(n), result: 'DUPLICATE', quarantined: true, detail: `Already received${st.receipt_no ? ' on ' + st.receipt_no : ''}${st.received_at ? ' ' + fmtD(st.received_at) : ''} — second ticket with the same code?` });
      addFeed('bad', `ALREADY RECEIVED: #${b.bundle_no} ${nm}`); render();
      await show({ kind: 'bad', title: 'ALREADY RECEIVED', msg: `<b>#${b.bundle_no} ${esc(nm)}</b> · Size ${esc(b.size)} (${esc(jobLine(cut))}) was already received${st.receipt_no ? ' on ' + esc(st.receipt_no) : ''}.<br><br>A second ticket with the same code? Put it aside for the supervisor.` });
      continue;
    }
    if (st?.status === 'QUARANTINE') { msgs.push(`#${b.bundle_no} ${nm} is in quarantine — release it from the Quarantine list`); worst = 'bad'; continue; }
    let result = 'OK', note = '';
    if (st?.status === 'MISSING') { result = 'FOUND'; note = 'Was reported missing — now found'; }
    else if (RC.source === 'PRINTER') {
      if (!exp.includes(n)) { result = 'PART_NOT_PRINTED'; note = `${nm} is not a printed part but came back from ${RC.from}`; }
      else if (b.location === 'CUTTING') { result = 'NOT_DISPATCHED'; note = b.bag_code ? `Still shown in ${bagTxt(b.bag_code)} in the cutting room — left without a delivery note` : 'Never bagged or dispatched — left the cutting room without a delivery note'; }
      else if (atPrinter(b) && b.holder !== RC.from) { result = 'PRINTER_MISMATCH'; note = `Dispatched to ${b.holder}${dn.dn ? ' on ' + dn.dn : ''}, received from ${RC.from}`; }
      else if (b.location === 'MISSING') { result = 'FOUND'; note = 'Bundle was reported missing — now found'; }
    } else if (!exp.includes(n)) { result = 'SKIPPED_PRINTER'; note = `${nm} should go to the printer but came straight from cutting — printed?`; }
    const r = await push({ t: 'part', row: partRow(b, cut, n, 'RECEIVED', result), allowFrom: ['MISSING'] });
    if (r.conflict) { await loadJob(b.cut_id).catch(() => {}); render(); await show({ kind: 'bad', title: 'NOT RECEIVED', msg: esc(r.conflict) }); continue; }
    (J.parts[b.id] = J.parts[b.id] || {})[n] = { status: 'RECEIVED', receipt_id: RC.id, receipt_no: RC.receipt_no, received_at: now(), flag: result };
    addItem({ ...base(n), result, detail: note || null });
    log(result === 'OK' ? 'RCV_OK' : 'RCV_' + result, `#${b.bundle_no} ${nm} · ${b.size} · ${b.qty}${note ? ' — ' + note : ''}${manual ? ' (manual entry)' : ''}`, { code: raw, cut_id: b.cut_id, bundle_no: b.bundle_no });
    if (result !== 'OK') { msgs.push(note); worst = worst === 'bad' ? 'bad' : 'warn'; }
  }
  // all printed parts of this bundle in? -> the bundle has finished its printer journey
  const pn = printNos(cut);
  if (b.location !== 'SEWING' && pn.every(n => pState(J, b, n)?.status === 'RECEIVED')) {
    await push({ t: 'bundle_loc', id: b.id, from: b.location, to: 'SEWING', holder: RC.sewing, at: now(), by: SES.name, receipt: RC.id });
    Object.assign(b, { location: 'SEWING', holder: RC.sewing, receipt_id: RC.id });
  }
  saveJobs();
  const ri = recvItems();
  if (worst === 'ok') {
    addFeed('ok', `#${b.bundle_no} ${label} · ${b.size} · ${b.qty}${manual ? ' (manual)' : ''}`);
    lastMsg('ok', `✓ #${b.bundle_no} ${esc(label)} · Size ${esc(b.size)} · ${b.qty}`, `${ri.length} panel bundles · ${sumQ(ri)} pieces on this receipt${QUEUE.length ? ' · saved offline' : ''}`); beep('ok'); flash('ok');
  } else if (msgs.length) {
    addFeed(worst, `#${b.bundle_no} ${label}: ${msgs.join('; ')}`);
    lastMsg(worst, `#${b.bundle_no} ${esc(label)} — flagged`, esc(msgs.join('; '))); beep(worst); if (worst === 'warn') flash('warn');
  }
  render(); bump();
}
async function manualEntry() {

  const parts = allParts(c), exp = expNos(c, RC.source);
  const r = await show({ kind: 'info', sound: false, title: 'Damaged ticket', msg: `<b>${esc(jobLine(c))}</b>
      <label class="f" style="margin-top:10px">Bundle number (from the ticket or the stamp)<input id="mN" inputmode="numeric"></label>
      ${c.parts?.length ? `<label class="f">Part<select id="mP">${parts.map(p => `<option value="${p.no}" ${exp[0] === p.no ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>` : ''}`,

/* ---------------- end receipt ---------------- */
async function endReceipt() {
  if (!RC) return;
  if (QUEUE.length) { await sync(); if (QUEUE.length) return show({ kind: 'warn', title: 'Waiting for connection', msg: `${QUEUE.length} scans are still waiting to upload. Ending a receipt needs the latest data — try again when the phone is online.` }); }
  const ri = recvItems(), fl = flagItems();
  if (!RC.cut_id) {
    const r = await show({ kind: 'info', title: 'Nothing received', msg: 'No bundle of a job was received on this receipt.', buttons: [{ label: 'Close this receipt', val: true }, { label: 'Back', val: false, cls: 'sec' }] });
    if (r) { await net(() => Store.update('cw_receipts', { id: RC.id }, { status: 'CLOSED', outcome: 'COMPLETE', bundles_received: 0, units_received: 0, flagged: fl.length, closed_at: now(), notes: 'Ended with nothing received' }), 8000, true).catch(() => {}); RC = null; saveRC(); render(); }
    return;
  }
  let J;
  try { J = await net(() => loadJob(RC.cut_id), 10000, true); } catch (e) { return show({ kind: 'warn', title: 'No connection', msg: 'Ending a receipt needs the network so the outstanding panels are up to date.' }); }
  const c = cutOf(RC.cut_id);
  const out = outstanding(J, c, RC.source, RC.from);
  const outU = out.reduce((s, o) => s + (+o.b.qty || 0), 0);
  const who = RC.source === 'PRINTER' ? RC.from : 'the cutting room';
  const doc = RC.source === 'PRINTER' ? `${esc(RC.from)}'s delivery note ${esc(RC.ref)}` : `the cutting room's transfer note${RC.ref ? ' ' + esc(RC.ref) : ''}`;
  const byPart = p => { const g = {}; p.forEach(o => (g[pName(c, o.n)] = g[pName(c, o.n)] || []).push(o)); return Object.entries(g).map(([nm, a]) => `<b>${esc(nm)}</b>: ${a.slice(0, 40).map(o => '#' + o.b.bundle_no).join(', ')}${a.length > 40 ? ` … +${a.length - 40}` : ''}`).join('<br>'); };
  const summary = `<div style="font-size:21px;font-weight:800">${ri.length} panel bundles · ${sumQ(ri)} pieces received</div><div class="muted">${esc(jobLine(c))} · from ${esc(who)}${fl.length ? ` · ${fl.length} flagged` : ''}</div>`;
  let outcome = 'COMPLETE';
  if (!out.length) {

    if (!ok) return;
  } else {
    const r = await show({ kind: 'warn', title: `${out.length} panel bundles not received`, msg: summary + `<div style="margin-top:10px"><b>${out.length} panel bundles / ${outU} pieces</b> expected from ${esc(who)} have not arrived:</div><div style="font-size:14px;margin-top:6px">${byPart(out)}</div>
      <div style="margin-top:14px;font-size:18px;font-weight:800">What does ${doc} say?</div>`,
      buttons: [{ label: 'Balance to follow', val: 'BALANCE_TO_FOLLOW' }, { label: 'Delivered in full — panels are MISSING', val: 'MISSING', cls: 'sec' }, { label: 'Back — keep scanning', val: null, cls: 'sec' }] });
    if (!r) return;
    outcome = r;
    if (r === 'MISSING') {
      const ok = await show({ kind: 'bad', title: 'Report missing?', msg: `${out.length} panel bundles (${outU} pieces) will be marked MISSING and an investigation opened on the dashboard.`, buttons: [{ label: 'Yes — open investigation', val: true }, { label: 'Back', val: false, cls: 'sec' }] });
      if (!ok) return;
    }
  }
  let inv = null;
  try {
    if (outcome === 'MISSING') {
      const missing = out.map(({ b, n }) => { const d = J.bagdn[b.bag_code] || {}; return { bundle_id: b.id, code: b.code, bundle_no: b.bundle_no, part_no: n, part_name: pName(c, n), size: b.size, qty: b.qty, lay_no: b.lay_no, dyelot: b.dyelot, sobar_from: b.sobar_from, sobar_to: b.sobar_to, bag_code: b.bag_code || null, bagged_by: b.bagged_by || null, dn_no: d.dn || null, dispatched_at: d.at || null, vehicle: d.vehicle || null, location: b.location, holder: b.holder }; });
      inv = { inv_no: mkNo('INV'), cut_id: RC.cut_id, source: RC.source, printer: RC.from, printer_dn: RC.ref || null, receipt_id: RC.id, receipt_no: RC.receipt_no, status: 'OPEN', missing_bundles: out.length, missing_units: outU, missing, opened_by: SES.name };

      await net(() => Store.insert('cw_bundle_parts', out.map(({ b, n }) => ({ bundle_id: b.id, cut_id: b.cut_id, bundle_no: b.bundle_no, part_no: n, part_name: pName(c, n), status: 'MISSING', source: RC.source, flag: 'MISSING', receipt_id: RC.id, receipt_no: RC.receipt_no, inv_no: inv.inv_no }))), 15000, true);
      if (RC.source === 'PRINTER') await net(() => Store.updateCond('cw_bundles', { id: uniq(out.map(o => o.b.id)), location: ['TRANSIT_PRINT', 'PRINTER'] }, { location: 'MISSING' }), 8000, true);
      log('RCV_MISSING', `${inv.inv_no}: ${out.length} panel bundles / ${outU} pcs missing from ${who}${RC.ref ? ' (note ' + RC.ref + ' says delivered in full)' : ''}`, { code: inv.inv_no, cut_id: RC.cut_id });
    }
    await net(() => Store.update('cw_receipts', { id: RC.id }, { status: 'CLOSED', outcome, cut_id: RC.cut_id, bundles_received: ri.length, units_received: sumQ(ri), flagged: fl.length, outstanding_bundles: out.length, outstanding_units: outU, closed_at: now(), notes: inv ? 'Investigation ' + inv.inv_no : null }), 8000, true);
  } catch (e) { return show({ kind: 'bad', title: 'Could not end the receipt', msg: esc(e.message) }); }
  log('RCV_END', `${RC.receipt_no} ended — ${outcome.replace(/_/g, ' ').toLowerCase()}`, { code: RC.receipt_no, cut_id: RC.cut_id });
  const done = { rc: { ...RC }, outcome, out, outU, inv, c };
  addFeed(outcome === 'MISSING' ? 'bad' : 'ok', `${RC.receipt_no} ended — ${outcome.replace(/_/g, ' ').toLowerCase()}`);
  RC = null; saveRC(); render();
  lastMsg(outcome === 'MISSING' ? 'bad' : 'ok', `${esc(done.rc.receipt_no)} ended`, outcome === 'MISSING' ? `Investigation ${esc(inv.inv_no)} opened` : outcome === 'BALANCE_TO_FOLLOW' ? `${out.length} panel bundles to follow` : 'Complete');
  const p = await show({ kind: 'info', sound: false, title: `${esc(done.rc.receipt_no)} ended`, msg: outcome === 'MISSING' ? `<div class="verdict bad">Investigation ${esc(inv.inv_no)} opened for ${out.length} missing panel bundles. The supervisor will see it on the dashboard.</div>` : outcome === 'BALANCE_TO_FOLLOW' ? `<div class="verdict warn">${out.length} panel bundles / ${outU} pieces to follow.</div>` : '<div class="verdict ok">Complete.</div>', buttons: [{ label: 'Print goods received note', val: true }, { label: 'Done', val: false, cls: 'sec' }] });

}

/* ---------------- quarantine ---------------- */
async function quarantine() {
  let rows;
  try { rows = await net(() => Store.list('cw_bundle_parts', { status: 'QUARANTINE' }), 8000, true); } catch (e) { return show({ kind: 'warn', title: 'No connection', msg: 'The quarantine list needs the network.' }); }
  if (!rows.length) return show({ kind: 'info', sound: false, title: 'Quarantine', msg: '<p>Nothing in quarantine.</p>', buttons: [{ label: 'Close', val: null, cls: 'sec' }] });
  if (rows.some(r => !cutOf(r.cut_id))) await loadBase().catch(() => {});
  const r = await show({ kind: 'info', sound: false, title: `Quarantine — ${rows.length} panel bundles`,
    msg: `<table class="t">${rows.map(q => `<tr><td><b>#${q.bundle_no} ${esc(q.part_name)}</b><br><span class="muted">${esc(jobLine(cutOf(q.cut_id)))} — found on ${esc(q.receipt_no || '')}</span></td><td><button class="btn sec sm" data-v="${q.id}">Release</button></td></tr>`).join('')}</table>
      <p class="muted">Release = taken into its own job on the sewing floor. Needs a supervisor PIN.</p>`,
    buttons: [{ label: 'Close', val: null, cls: 'sec' }] });
  if (!r) return;
  const q = rows.find(x => x.id === r), c = cutOf(q.cut_id);
  const sup = await supervisorPin(`Release #${q.bundle_no} ${q.part_name} (${jobTag(c)}) from quarantine`); if (!sup) return;
  await net(() => Store.update('cw_bundle_parts', { id: q.id }, { status: 'RECEIVED', flag: 'RELEASED', released_by: sup, released_at: now(), received_at: now(), received_by: SES.name }), 8000, true);
  await net(() => Store.update('cw_receipt_items', { bundle_id: q.bundle_id, part_no: q.part_no, result: 'WRONG_JOB' }, { released_by: sup, released_at: now() }), 8000, true);
  // printed parts all in now? -> bundle reaches the sewing floor
  const J = await loadJob(q.cut_id).catch(() => null);
  const b = J?.bundles.find(x => x.id === q.bundle_id);
  if (b && b.location !== 'SEWING' && printNos(c).every(n => pState(J, b, n)?.status === 'RECEIVED')) await net(() => Store.update('cw_bundles', { id: b.id }, { location: 'SEWING', holder: sewingName(), received_at: now(), received_by: SES.name }), 8000, true);
  log('RCV_RELEASED', `#${q.bundle_no} ${q.part_name} (${jobLine(c)}) released from quarantine into its own job`, { cut_id: q.cut_id, bundle_no: q.bundle_no, supervisor: sup });
  addFeed('warn', `#${q.bundle_no} ${q.part_name} released (approved by ${sup})`); lastMsg('warn', `#${q.bundle_no} ${esc(q.part_name)} released`, `Received into ${esc(jobLine(c))} — approved by ${esc(sup)}`);
  if (RC?.cut_id) await loadJob(RC.cut_id).catch(() => {});
  render();
}

/* ---------------- menu ---------------- */
async function menu() {
  const r = await show({ kind: 'info', sound: false, title: 'Menu', msg: `<span class="muted">${esc(SES.name)} · ${esc(DEV.station)}${QUEUE.length ? ` · ${QUEUE.length} scans waiting to sync` : ''}</span>`,
    buttons: [{ label: RC ? 'Abandon this receipt' : 'Start a receipt', val: 'rc' }, { label: Cam.on ? 'Turn camera off' : 'Turn camera on', val: 'cam', cls: 'sec' }, { label: 'Refresh', val: 'ref', cls: 'sec' }, { label: 'Change station / connection', val: 'set', cls: 'sec' }, { label: 'Sign out', val: 'out', cls: 'sec' }, { label: 'Close menu', val: null, cls: 'sec' }] });
  if (r === 'rc') {
    if (!RC) return startReceipt();
    if (RC.items.length) return show({ kind: 'warn', title: 'Receipt has scans', msg: 'Bundles have already been received on this receipt. Use <b>End receipt</b> instead.' });
    await net(() => Store.update('cw_receipts', { id: RC.id }, { status: 'CLOSED', outcome: 'COMPLETE', closed_at: now(), notes: 'Abandoned — nothing scanned' }), 8000, true).catch(() => {});
    RC = null; saveRC(); render(); lastMsg('info', 'Receipt abandoned');
  }
  if (r === 'cam') Cam.toggle();
  if (r === 'ref') { await loadBase().catch(() => {}); if (RC?.cut_id) await loadJob(RC.cut_id).catch(() => {}); render(); }
  if (r === 'set') { await Cam.stop(); renderSetup(); }
  if (r === 'out') { log('RCV_LOGOUT', `${SES.name} signed out`); await Cam.stop(); SES = null; LS.set('cw_recv_session', null); boot(); }
}

/* ---------------- start ---------------- */
async function boot() {
  if (!DEV) return renderSetup();
  if (!sessionOk()) return renderLogin();
  renderMain();
  try { await loadBase(); if (RC?.cut_id) await loadJob(RC.cut_id); render(); } catch (e) {}
  sync();
}
setInterval(() => { if (!ONLINE) probe(); else if (QUEUE.length) sync(); }, 8000);
setInterval(() => { if (SES && $('#rcBox') && !OVBUSY && RC?.cut_id && !QUEUE.length && ONLINE) loadJob(RC.cut_id).then(renderProg).catch(() => {}); }, 25000);
window.addEventListener('online', () => probe());
window.addEventListener('offline', () => setOnline(false));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') focusWedge(); });
Store.init().then(boot);
</script>
</body>
